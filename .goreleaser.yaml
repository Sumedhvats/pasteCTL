# .goreleaser.yml
project_name: pasteCTL
version: 2

before:
  hooks:
    - go mod tidy

builds:
  -
    main: .
    binary: pasteCTL
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Sumedhvats/pasteCTL/cmd.Version={{.Version}} -X github.com/Sumedhvats/pasteCTL/cmd.Commit={{.Commit}}

archives:
  -
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

# no brews, no scoops

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'Merge pull request'

release:
  draft: false
  prerelease: auto
